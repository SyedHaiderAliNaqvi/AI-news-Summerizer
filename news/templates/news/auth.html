<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - AI News Chat</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f4f6f8; color: #222; }
    .box { background: white; padding: 28px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); width: 100%; max-width: 380px; margin: 16px; }
    h1 { font-size: 1.1em; margin: 0 0 4px; color: #1a3a5c; }
    h2 { margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 4px; font-size: 1em; border: 1px solid #ccc; border-radius: 8px; }
    .helptext, ul.errorlist { font-size: 0.8em; color: #666; padding-left: 18px; margin: 4px 0; }
    ul.errorlist { color: #8a1f1f; }
    button { width: 100%; margin-top: 18px; background: #1a5fb4; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1em; cursor: pointer; }
    .alt { text-align: center; font-size: 0.9em; margin-top: 14px; }
    a { color: #1a5fb4; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📰 AI News Chat</h1>
    <h2>{{ title }}</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">{{ button }}</button>
    </form>
    <p class="alt">{{ alt_text }} <a href="{% url alt_url %}">{{ alt_link }}</a></p>
    <p class="alt"><a href="{% url 'home' %}">← Continue as guest</a></p>
  </div>
</body>
</html>
