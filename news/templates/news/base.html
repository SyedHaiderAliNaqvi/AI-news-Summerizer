<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI News Summarizer{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4f6f8; color: #222; line-height: 1.5; }
    header { border-bottom: 2px solid #1a3a5c; margin-bottom: 24px; }
    header a { text-decoration: none; color: #1a3a5c; }
    a { color: #1a5fb4; }
    .card { background: white; padding: 18px; margin-bottom: 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h3 { margin-top: 0; }
    .meta { color: #666; font-size: 0.9em; margin: 6px 0 0; }
    .topic-link { display: block; font-size: 1.2em; text-decoration: none; font-weight: 600; }
    .btn { background: #1a5fb4; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 1em; cursor: pointer; }
    .btn:disabled { background: #888; cursor: wait; }
    .message { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
    .message.success { background: #dff3e4; color: #1e6b34; }
    .message.error { background: #fbe0e0; color: #8a1f1f; }
    footer { color: #666; font-size: 0.85em; margin: 30px 0 10px; border-top: 1px solid #ddd; padding-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'home' %}">AI News Summarizer</a></h1>
  </header>

  {% if messages %}
    {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

  <footer>
    Summaries are AI-generated and may contain errors. Always verify with the original source.
  </footer>
</body>
</html>
